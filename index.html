<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f19">
  <meta name="color-scheme" content="dark light">
  
<title>Clipper Forge</title>
  <link rel="manifest" href="manifest.json">

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('ai-agent-theme');
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="premium-ui.css">

  <script src="./mp4-muxer.min.js"></script>
  <script>
    (function() {
      'use strict';

      window.FFMPEG_CORE_WASM_URL = "https://github.com/clipperforgeai/Clipper-Forge/releases/download/V2.0.0/ffmpeg-core.wasm";

  
     try {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.href = window.FFMPEG_CORE_WASM_URL;
        link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      } catch (e) { /* noop */ }

      console.log('[Config] FFmpeg core WASM URL:', window.FFMPEG_CORE_WASM_URL);
    })();
  </script>
</head>
